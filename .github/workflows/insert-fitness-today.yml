name: Insert daily fitness (PKT 17:00)

on:
  schedule:
    # 12:00 UTC == 17:00 PKT (Pakistan Standard Time, UTC+5)
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  insert-fitness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install @supabase/supabase-js

      - name: Insert today's PKT fitness entries (skip existing)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "ERROR: SUPABASE_URL or SUPABASE_KEY secret is not set" >&2
            exit 1
          fi

          cat <<'JS' > /tmp/insert_fitness_today.js
          const { createClient } = require('@supabase/supabase-js');

          function getPktDateStrings() {
            const now = new Date();
            const pktMs = now.getTime() + 5 * 60 * 60 * 1000;
            const pkt = new Date(pktMs);

            const y = pkt.getUTCFullYear();
            const m = String(pkt.getUTCMonth() + 1).padStart(2, '0');
            const d = String(pkt.getUTCDate()).padStart(2, '0');
            const pktDate = `${y}-${m}-${d}`;

            const nextPkt = new Date(pktMs + 24 * 60 * 60 * 1000);
            const ny = nextPkt.getUTCFullYear();
            const nm = String(nextPkt.getUTCMonth() + 1).padStart(2, '0');
            const nd = String(nextPkt.getUTCDate()).padStart(2, '0');
            const pktNextDate = `${ny}-${nm}-${nd}`;

            return { pktDate, pktNextDate };
          }

          function randomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
          }

          async function run() {
            const supabase = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_KEY);
            const { pktDate, pktNextDate } = getPktDateStrings();

            const fromTs = `${pktDate}T00:00:00+05:00`;
            const toTs = `${pktNextDate}T00:00:00+05:00`;
            const createdAt = `${pktDate}T12:00:00+05:00`;

            console.log('PKT date window:', fromTs, 'to', toTs);

            const { data: patients, error: patientErr } = await supabase
              .from('users')
              .select('id')
              .eq('role', 'patient');

            if (patientErr) {
              console.error('Failed to fetch patients:', patientErr);
              process.exit(1);
            }

            const { data: existingRows, error: existingErr } = await supabase
              .from('fitness')
              .select('patient_id')
              .gte('created_at', fromTs)
              .lt('created_at', toTs);

            if (existingErr) {
              console.error('Failed to fetch existing fitness rows:', existingErr);
              process.exit(1);
            }

            const existingPatientIds = new Set((existingRows || []).map((r) => r.patient_id));

            const rowsToInsert = (patients || [])
              .filter((p) => !existingPatientIds.has(p.id))
              .map((p) => ({
                patient_id: p.id,
                created_at: createdAt,
                steps: randomInt(1000, 10000),
                water: Number((Math.random() * 2.5 + 0.5).toFixed(2)),
                sleep: Number((Math.random() * 4 + 4).toFixed(2)),
                calories_burned: randomInt(200, 1000),
                calories_intake: randomInt(1200, 2700),
                fat: Number((Math.random() * 60 + 10).toFixed(2)),
                protein: Number((Math.random() * 80 + 10).toFixed(2)),
                carbs: Number((Math.random() * 250 + 50).toFixed(2)),
                walk_calories_burned: Number((Math.random() * 200).toFixed(2))
              }));

            if (rowsToInsert.length === 0) {
              console.log('No inserts needed: all patients already have a fitness entry for today (PKT).');
              return;
            }

            const { error: insertErr } = await supabase
              .from('fitness')
              .insert(rowsToInsert);

            if (insertErr) {
              console.error('Insert failed:', insertErr);
              process.exit(1);
            }

            console.log(`Inserted ${rowsToInsert.length} fitness rows for PKT date ${pktDate}.`);
          }

          run().catch((err) => {
            console.error('Unhandled error:', err);
            process.exit(1);
          });
          JS

          node /tmp/insert_fitness_today.js
