name: Insert daily fitness (PKT 17:00)

on:
  schedule:
    # 12:00 UTC == 17:00 PKT (Pakistan Standard Time, UTC+5)
    - cron: '0 12 * * *'
  workflow_dispatch: {}

jobs:
  insert-fitness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install @supabase/supabase-js

      - name: Insert today's PKT fitness entries (Supabase)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "ERROR: SUPABASE_URL or SUPABASE_KEY secret is not set" >&2
            exit 1
          fi

          cat <<'JS' > /tmp/insert_fitness_today.js
          (async () => {
            const { createClient } = require('@supabase/supabase-js');
            const supabase = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_KEY);

            const now = new Date();
            const pktMs = now.getTime() + 5 * 60 * 60 * 1000;
            const pkt = new Date(pktMs);
            const y = pkt.getUTCFullYear();
            const m = String(pkt.getUTCMonth() + 1).padStart(2, '0');
            const d = String(pkt.getUTCDate()).padStart(2, '0');
            const pktDate = `${y}-${m}-${d}`;
            const nextDateObj = new Date(pktMs + 24 * 60 * 60 * 1000);
            const ny = nextDateObj.getUTCFullYear();
            const nm = String(nextDateObj.getUTCMonth() + 1).padStart(2, '0');
            const nd = String(nextDateObj.getUTCDate()).padStart(2, '0');
            const pktNextDate = `${ny}-${nm}-${nd}`;

            console.log('PKT date:', pktDate);

            const { data: patients, error: pErr } = await supabase
              .from('users')
              .select('id')
              .eq('role', 'patient');

            if (pErr) { console.error('Failed to fetch patients', pErr); process.exit(1); }

            for (const p of patients || []) {
              const fromTs = `${pktDate}T00:00:00+05:00`;
              const toTs = `${pktNextDate}T00:00:00+05:00`;

              const { data: existing, error: eErr } = await supabase
                .from('fitness')
                .select('id')
                .eq('patient_id', p.id)
                .gte('created_at', fromTs)
                .lt('created_at', toTs)
                .limit(1);

              if (eErr) { console.error('Failed to check existing fitness for', p.id, eErr); continue; }
              if (existing && existing.length > 0) {
                console.log('Skipping existing for', p.id);
                continue;
              }

              const rnd = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
              const steps = rnd(1000, 10000);
              const water = Number((Math.random() * 2.5 + 0.5).toFixed(2));
              const sleep = Number((Math.random() * 4 + 4).toFixed(2));
              const calories_burned = rnd(200, 1000);
              const calories_intake = rnd(1200, 2700);
              const fat = Number((Math.random() * 60 + 10).toFixed(2));
              const protein = Number((Math.random() * 80 + 10).toFixed(2));
              const carbs = Number((Math.random() * 250 + 50).toFixed(2));
              const walk_calories_burned = Number((Math.random() * 200).toFixed(2));

              const created_at = `${pktDate}T12:00:00+05:00`;

              const { data: ins, error: insErr } = await supabase
                .from('fitness')
                .insert([{
                  patient_id: p.id,
                  created_at,
                  steps,
                  water,
                  sleep,
                  calories_burned,
                  calories_intake,
                  fat,
                  protein,
                  carbs,
                  walk_calories_burned
                }]);

              if (insErr) {
                console.error('Insert failed for', p.id, insErr);
              } else {
                console.log('Inserted fitness for', p.id);
              }
            }

            console.log('Done');
          })().catch(e => { console.error(e); process.exit(1); });

