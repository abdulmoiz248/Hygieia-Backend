name: Scheduled Data Check

on:
  schedule:
    # Run every 2 days at 00:00 UTC (adjust time as needed)
    - cron: '0 0 */2 * *'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  check-databases:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install @supabase/supabase-js mongodb
      
      - name: Query Supabase and MongoDB
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          node -e "
          const { createClient } = require('@supabase/supabase-js');
          const { MongoClient } = require('mongodb');
          
          async function checkDatabases() {
            try {
              // Supabase check
              console.log('🔍 Connecting to Supabase...');
              const supabase = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_KEY);
              const { data: supabaseData, error: supabaseError } = await supabase
                .from('users') // Replace with your table name
                .select('*')
                .limit(5);
              
              if (supabaseError) throw supabaseError;
              console.log('✅ Supabase Data:');
              console.log(JSON.stringify(supabaseData, null, 2));
              
              // MongoDB check
              console.log('\n🔍 Connecting to MongoDB...');
              const client = new MongoClient(process.env.MONGODB_URI);
              await client.connect();
              const db = client.db();
              const collections = await db.listCollections().toArray();
              
              console.log('✅ MongoDB Collections:');
              console.log(JSON.stringify(collections, null, 2));
              
              // Query a sample collection (adjust as needed)
              if (collections.length > 0) {
                const firstCollection = db.collection(collections[0].name);
                const sample = await firstCollection.findOne();
                console.log('\n📄 Sample Document:');
                console.log(JSON.stringify(sample, null, 2));
              }
              
              await client.close();
              
              console.log('\n✨ Database check completed successfully!');
            } catch (error) {
              console.error('❌ Error:', error.message);
              process.exit(1);
            }
          }
          
          checkDatabases();
          "
